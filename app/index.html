<script>window.VOYZ={tours:[{"slug":"grand-expedition","badge":"Флагманская экспедиция","title":"Grand Expedition","headline":"Восемь дней на внедорожниках: три высокогорных озера, красные каньоны и юрты под звёздами","card_title":"Восемь дней, три озера, два внедорожника","summary":"Небольшая группа, два внедорожника и маршрут, в котором каждый день открывает другой Кыргызстан: от каньонов Кок-Мойнок до озера Сон-Куль.","hero":"cover","hero_pos":"50% 55%","card_img":"kelsuu","season":"Июнь — сентябрь","months":[6,7,8,9],"seasons":["summer"],"facts":[["8 / 7","дней и ночей"],["6–8","путешественников"],["2","внедорожника"],["3","высокогорных озера"]],"lakes":[{"name":"Ала-Куль","alt":"≈ 3500 м","img":"alakul","pos":"40% 55%","text":"Бирюзовая вода среди ледников и каменных вершин. Путь — верхом и немного пешком."},{"name":"Кель-Суу","alt":"пограничная зона","img":"kel_v","pos":"50% 50%","text":"Озеро, спрятанное между гигантскими скалами. Одно из самых необычных в стране."},{"name":"Сон-Куль","alt":"≈ 3000 м","img":"song_sunset","pos":"50% 50%","text":"Бескрайние пастбища, табуны лошадей и юрты у воды. Закат, который запоминается."}],"days":[{"n":1,"title":"Из города — в сердце Тянь-Шаня","route":"Бишкек → Кок-Мойнок → Каракол","img":"kok","pos":"55% 50%","caption":"Каньоны Кок-Мойнок","text":"Едем на восток. Первое большое впечатление — красные и песочные «замки» каньонов Кок-Мойнок. Дальше — северный берег Иссык-Куля, хребты до горизонта и остановки там, где хочется снимать.","moments":["Каньоны Кок-Мойнок","Северный берег Иссык-Куля","Каракол"],"note":"Если позволит время — дополнительная остановка в Григорьевском или Семёновском ущелье.","stay":"Каракол, гостиница"},{"n":2,"title":"Дорога к облакам","route":"Алтын-Арашан → Ала-Куль","img":"altyn","pos":"60% 50%","img2":"ala_trail","caption":"Долина Алтын-Арашан","text":"На специальном внедорожнике поднимаемся в долину Алтын-Арашан, завтракаем среди гор — и в седло. Путь к Ала-Кулю идёт через альпийские луга и каменистые склоны.","moments":["Долина Алтын-Арашан","Верхом к Ала-Кулю","Горный лагерь"],"note":"Часть пути может идти пешком. Выход к озеру зависит от подготовки группы и погоды.","stay":"Алтын-Арашан, горный лагерь"},{"n":3,"title":"Красные скалы и зелёные долины","route":"Алтын-Арашан → Джети-Огуз → южный берег Иссык-Куля","img":"jeti_horses","pos":"60% 50%","caption":"Джети-Огуз","text":"Спускаемся в ущелье Джети-Огуз: красные скалы, ельники и альпийские долины в одном кадре. Конная прогулка, водопад «Девичьи косы», обед в горах — и к Иссык-Кулю.","moments":["Скалы Джети-Огуз","Конная прогулка","Водопад «Девичьи косы»"],"stay":"Южный берег Иссык-Куля"},{"n":4,"title":"Там, где горы меняют цвет","route":"Барскоон → каньон Сказка → Иссык-Куль","img":"skazka","pos":"40% 55%","img2":"bars_fall","caption":"Каньон Сказка","text":"Водопады Барскоона — «Слёзы барса» и «Чаша Манаса». Потом каньон Сказка: красные, оранжевые и золотые скалы, похожие на замки и целые города. Остаток дня — свободный, на берегу озера.","moments":["Водопады Барскоона","Каньон Сказка","Свободный вечер у озера"],"stay":"Южный берег Иссык-Куля, по возможности там же, где накануне"},{"n":5,"title":"От каньонов к высокогорью","route":"Ак-Сай → Орто-Токой → Нарын","img":"aksai","pos":"60% 50%","img2":"orto","caption":"Каньоны Ак-Сай","text":"Каньоны Ак-Сай — песчаные гребни и панорамы, будто с другой планеты. Затем — в Нарынскую область, мимо бирюзового Орто-Токойского водохранилища. Вечером готовимся к Кель-Суу.","moments":["Каньоны Ак-Сай","Орто-Токойское водохранилище","Нарын"],"stay":"Нарын, гостиница"},{"n":6,"title":"Где заканчиваются обычные дороги","route":"Нарын → Кель-Суу","img":"kel_arch","pos":"45% 50%","img2":"kel_lake","caption":"Окрестности Кель-Суу","text":"Самый дикий переезд маршрута: высокогорные долины и сложные дороги до базового лагеря. Оттуда — верхом к Кель-Суу, озеру между отвесными скалами. Вечер — вдали от городской цивилизации.","moments":["Высокогорные долины","Верхом к Кель-Суу","Вечер в горном лагере"],"note":"Участок находится в пограничной зоне — разрешения на посещение оформляются заранее. Уровень воды в озере меняется от сезона к сезону.","stay":"Горный лагерь Кок-Кыя"},{"n":7,"title":"Дорога к озеру кочевников","route":"Кель-Суу → Нарын → Сон-Куль","img":"serp","pos":"60% 50%","img2":"songkul","caption":"Серпантин «33 попугая»","text":"Возвращаемся через Нарын и поднимаемся к Сон-Кулю по знаменитому серпантину «33 попугая». Вечером — юрточный лагерь, ужин и закат над высокогорными пастбищами.","moments":["Серпантин «33 попугая»","Юрточный лагерь","Закат над Сон-Кулем"],"stay":"Сон-Куль, юрточный лагерь"},{"n":8,"title":"Последняя дорога. Впечатления навсегда","route":"Сон-Куль → Калмак-Ашуу → Бишкек","img":"kalmak","pos":"55% 50%","caption":"Перевал Калмак-Ашуу","text":"Утро на озере и последние кадры. Через перевал Калмак-Ашуу возвращаемся в Бишкек, на заключительный ужин.","moments":["Утро на Сон-Куле","Перевал Калмак-Ашуу","Заключительный ужин"],"note":"При ночном рейсе — трансфер в аэропорт. Вылет после заключительного вечера приходится уже на следующий календарный день.","stay":"Бишкек — завершение маршрута"}],"fit_yes":["Вам интересен настоящий Кыргызстан: высокогорье, конные маршруты, удалённые долины, ночёвки в горах","Вы готовы к длинным переездам и серьёзной физической нагрузке в отдельные дни","Вам важнее впечатления и люди рядом, чем гостиничный комфорт"],"fit_no":["Вы ждёте пятизвёздочного сервиса и спа: в горных лагерях и юртах условия простые","Вам нужна гарантированная погода и неизменная программа: в горах она может меняться","Вы не готовы к конным и пешим участкам даже в простом формате"],"difficulty":[{"name":"Переезды","level":4,"text":"Длинные дни за рулём, горные и сложные дороги"},{"name":"Физическая нагрузка","level":3,"text":"Конные и пешие участки: Ала-Куль, Джети-Огуз, Кель-Суу"},{"name":"Высота","level":4,"text":"До ≈ 3500 м: Ала-Куль, Сон-Куль"},{"name":"Комфорт","level":2,"text":"Гостиницы, горные лагеря и традиционные юрты"}],"difficulty_note":"Шкала ориентировочная. Подготовку к конным и пешим участкам обсуждаем заранее, возможность подняться к Ала-Кулю зависит от подготовки и погоды.","organization":[["Транспорт","Два внедорожника на всю группу. На отдельных сложных участках транспорт может быть специальным."],["Группа","От 6 до 8 путешественников: можно общаться и не зависеть от большого автобуса."],["Ночёвки","Гостиницы в городах, горные лагеря и традиционные юрты."],["Лошади","Конные участки — Ала-Куль, Джети-Огуз и Кель-Суу."],["Разрешения","Кель-Суу находится в пограничной зоне: необходимые разрешения оформляются заранее."],["Аэропорт","При ночном рейсе организуем трансфер по согласованному расписанию."]],"organization_note":"Точный состав услуг и стоимость мы согласуем отдельно: оставьте заявку — вернёмся с программой и расчётом под вашу группу и даты.","faq":[["Сколько стоит экспедиция?","Стоимость зависит от состава группы, дат и выбранных услуг, поэтому мы не публикуем одну цифру «для всех». Оставьте заявку, и мы пришлём программу с расчётом."],["Когда можно поехать?","Сезон — с июня по сентябрь. В заявке укажите удобный месяц, а мы подскажем, как лучше расположить даты."],["Сколько человек в группе?","От 6 до 8 путешественников и два внедорожника."],["Нужен ли опыт верховой езды?","Нет, но конные участки есть: Ала-Куль, Джети-Огуз и Кель-Суу. Часть пути к Ала-Кулю может идти пешком. Подготовку к конным и пешим участкам согласовываем заранее."],["Что с высотой?","Ала-Куль находится на высоте около 3500 м, Сон-Куль — около 3000 м. Маршрут проходит в высокогорье, поэтому программа учитывает самочувствие группы."],["Нужны ли разрешения для Кель-Суу?","Да: участок находится в пограничной зоне, и разрешения оформляются заранее. Мы подскажем, какие данные нужны для оформления."],["Что если испортится погода?","Программа может меняться из-за погодных условий, состояния дорог и безопасности участников. Например, возможность выхода к озеру Ала-Куль зависит от погоды и подготовки группы."],["Как организован финал, если рейс ночной?","Вечером возвращаемся в Бишкек, ужинаем, и мы организуем трансфер в аэропорт по согласованному расписанию. Вылет после заключительного вечера приходится уже на следующий календарный день."]],"map":true},{"slug":"put-karavanov","badge":"Шёлковый путь","title":"Путь караванов","headline":"Шесть дней по следам Великого шёлкового пути: Таш-Рабат, Чатыр-Куль и ночи в юртах","card_title":"Караван-сарай, высокогорное озеро и юрты","summary":"Средневековый караван-сарай Таш-Рабат, бескрайнее озеро Чатыр-Куль и вечера у Сон-Куля: путь кочевников и купцов на внедорожниках.","hero":"tash","hero_pos":"50% 55%","card_img":"tash2","season":"Июнь — сентябрь","months":[6,7,8,9],"seasons":["summer"],"facts":[["6 / 5","дней и ночей"],["4–8","путешественников"],["2","внедорожника"],["1","караван-сарай"]],"lakes":[{"name":"Таш-Рабат","alt":"караван-сарай","img":"tash","pos":"50% 50%","text":"Каменный караван-сарай в долине, где когда-то останавливались купцы Великого шёлкового пути."},{"name":"Чатыр-Куль","alt":"высокогорное озеро","img":"chatyr","pos":"50% 50%","text":"Огромное озеро на высоте более 3000 метров среди открытых степей. Участок в приграничной зоне."},{"name":"Сон-Куль","alt":"юрты и жайлоо","img":"song_sunset","pos":"50% 50%","text":"Заключительные вечера в юртах у воды и табуны лошадей на закате."}],"days":[{"n":1,"title":"На юг, в глубь Тянь-Шаня","route":"Бишкек → Кочкор → Нарын","img":"naryn","pos":"50% 50%","caption":"Нарын","text":"Выезжаем из Бишкека и поднимаемся в горы: перевалы, долины, первые табуны. Вечером — в Нарыне, где начинается настоящая глубинка.","moments":["Горные перевалы","Кочкор","Нарын"],"stay":"Нарын, гостиница"},{"n":2,"title":"К каменным стенам караванов","route":"Нарын → Ат-Баши → Таш-Рабат","img":"tash2","pos":"50% 50%","img2":"tash_valley","caption":"Таш-Рабат","text":"Дорога вдоль реки Ат-Баши приводит к Таш-Рабату, средневековому караван-сараю среди холмов. Веч
