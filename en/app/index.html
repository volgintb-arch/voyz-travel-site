ack to Kel-Suu, a lake between sheer cliffs. An evening far from city civilization.","moments":["High-altitude valleys","On horseback to Kel-Suu","Evening at the mountain camp"],"note":"The area is in a border zone — visit permits are arranged in advance. The water level in the lake changes from season to season.","stay":"Kok-Kiya mountain camp"},{"n":7,"title":"The road to the lake of the nomads","route":"Kel-Suu → Naryn → Song-Kul","img":"serp","pos":"60% 50%","img2":"songkul","caption":"“33 Parrots” serpentine","text":"We return via Naryn and climb to Song-Kul along the famous “33 Parrots” serpentine. In the evening — a yurt camp, dinner and sunset over the high pastures.","moments":["“33 Parrots” serpentine","Yurt camp","Sunset over Song-Kul"],"stay":"Song-Kul, yurt camp"},{"n":8,"title":"The last road. Impressions forever","route":"Song-Kul → Kalmak-Ashuu → Bishkek","img":"kalmak","pos":"55% 50%","caption":"Kalmak-Ashuu pass","text":"A morning by the lake and the last photos. Over the Kalmak-Ashuu pass we return to Bishkek for the final dinner.","moments":["Morning at Song-Kul","Kalmak-Ashuu pass","Farewell dinner"],"note":"For a night flight — a transfer to the airport. A departure after the final evening falls on the next calendar day.","stay":"Bishkek — end of the route"}],"points":["8 days","3 lakes","2 4x4 vehicles"],"fit_yes":["You are interested in the real Kyrgyzstan: high mountains, horse routes, remote valleys, nights in the mountains","You are ready for long drives and serious physical effort on some days","Experiences and the people beside you matter more than hotel comfort"],"fit_no":["You expect five-star service and a spa: conditions in mountain camps and yurts are simple","You need guaranteed weather and an unchanging program: in the mountains it can change","You are not ready for horse and hiking sections, even in a simple format"],"difficulty":[{"name":"Drives","level":4,"text":"Long days at the wheel, mountain and difficult roads"},{"name":"Physical effort","level":3,"text":"Horse and hiking sections: Ala-Kul, Jeti-Oguz, Kel-Suu"},{"name":"Altitude","level":4,"text":"Up to ≈ 3,500 m: Ala-Kul, Song-Kul"},{"name":"Comfort","level":2,"text":"Hotels, mountain camps and traditional yurts"}],"difficulty_note":"The scale is approximate. We discuss preparation for the horse and hiking sections in advance; whether you can reach Ala-Kul depends on preparation and weather.","organization":[["Transport","Two 4x4 vehicles for the whole group. On some difficult sections the transport may be a specialized vehicle."],["Group","From 6 to 8 travelers: you can talk and not depend on a big tourist bus."],["Accommodation","Hotels in the cities, mountain camps and traditional yurts."],["Horses","Horse sections — Ala-Kul, Jeti-Oguz and Kel-Suu."],["Permits","Kel-Suu is in a border zone: the necessary permits are arranged in advance."],["Airport","For a night flight we arrange a transfer on an agreed schedule."]],"organization_note":"We agree the exact scope of services and the price separately: leave a request — we will come back with a program and a quote for your group and dates.","faq":[["How much does the expedition cost?","The price depends on the size of the group, the dates and the services you choose, so we do not publish a single figure “for everyone”. Leave a request and we will send a program with a quote."],["When can I go?","The season runs from June to September. Tell us a convenient month in your request, and we will suggest how best to arrange the dates."],["How many people are in the group?","From 6 to 8 travelers and two 4x4 vehicles."],["Do I need horse riding experience?","No, but there are horse sections: Ala-Kul, Jeti-Oguz and Kel-Suu. Part of the way to Ala-Kul may be on foot. We agree on preparation for horse and hiking sections in advance."],["What about altitude?","Ala-Kul lies at about 3,500 m and Song-Kul at about 3,000 m. The route runs through high mountains, so the program takes the group’s well-being into account."],["Do I need permits for Kel-Suu?","Yes: the area is in a border zone, and permits are arranged in advance. We will tell you what details are needed."],["What if the weather turns bad?","The program may change due to weather, road conditions and participants’ safety. For example, whether you can reach Lake Ala-Kul depends on the weather and the group’s fitness."],["How does the finale work if the flight is at night?","In the evening we return to Bishkek and have dinner, and we arrange an airport transfer on an agreed schedule. A departure after the final evening falls on the next calendar day."]],"map":true},{"slug":"put-karavanov","badge":"Silk Road","title":"Caravan Road","headline":"Шесть дней по следам Великого шёлкового пути: Таш-Рабат, Чатыр-Куль и ночи в юртах","card_title":"A caravanserai, a high-altitude lake and yurts","summary":"The medieval caravanserai of Tash-Rabat, the vast Lake Chatyr-Kul and evenings at Song-Kul: the path of nomads and merchants by 4x4.","hero":"tash","hero_pos":"50% 55%","card_img":"tash2","season":"June — September","months":[6,7,8,9],"seasons":["summer"],"facts":[["6 / 5","days and nights"],["4–8","travelers"],["2","4x4 vehicles"],["1","caravanserai"]],"lakes":[{"name":"Tash-Rabat","alt":"caravanserai","img":"tash","pos":"50% 50%","text":"A stone caravanserai in a valley where the merchants of the Great Silk Road once stopped."},{"name":"Chatyr-Kul","alt":"high-altitude lake","img":"chatyr","pos":"50% 50%","text":"A huge lake at more than 3,000 meters among open steppes. The area is in a border zone."},{"name":"Song-Kul","alt":"yurts and jailoo","img":"song_sunset","pos":"50% 50%","text":"Final evenings in yurts by the water and herds of horses at sunset."}],"days":[{"n":1,"title":"South, deep into the Tian Shan","route":"Bishkek → Kochkor → Naryn","img":"naryn","pos":"50% 50%","caption":"Naryn","text":"We leave Bishkek and climb into the mountains: passes, valleys, the first herds. In the evening — Naryn, where the real backcountry begins.","moments":["Mountain passes","Kochkor","Naryn"],"stay":"Naryn, hotel"},{"n":2,"title":"To the stone walls of the caravans","route":"Naryn → At-Bashy → Tash-Rabat","img":"tash2","pos":"50% 50%","img2":"tash_valley","caption":"Tash-Rabat","text":"The road along the At-Bashy river leads to Tash-Rabat, a medieval caravanserai among the hills. In the evening you can walk through the valley and hear the silence in which caravans once rested.","moments":["Tash-Rabat caravanserai","The valley in the evening","Yurt camp"],"stay":"Tash-Rabat, yurt camp"},{"n":3,"title":"A lake on the roof of the world","route":"Tash-Rabat → Chatyr-Kul → At-Bashy","img":"chatyr","pos":"50% 50%","caption":"Lake Chatyr-Kul","text":"We drive to Chatyr-Kul: a huge expanse of water among open ranges. Lots of sky here and few people. We return to At-Bashy for dinner in a guesthouse.","moments":["High-altitude steppes","Lake Chatyr-Kul","Dinner in a guesthouse"],"note":"The area is in a border zone: permits are arranged in advance.","stay":"At-Bashy, guesthouse"},{"n":4,"title":"To the nomads","route":"At-Bashy → Kochkor → Song-Kul","img":"songkul","pos":"60% 50%","caption":"Yurt camp at Song-Kul","text":"The road north and then up to Song-Kul. In the evening — yurts, dinner, the steppe wind and sunset over the lake.","moments":["Kochkor","The climb to Song-Kul","Sunset by the water"],"stay":"Song-Kul, yurt camp"},{"n":5,"title":"A day without hurry on the jailoo","route":"Song-Kul","img":"song_riders","pos":"50% 60%","caption":"Jailoo of Song-Kul","text":"A full day on the high pastures: a ride, conversation with herders, tea by the yurt. A day for silence and photographs.","moments":["Horseback ride","Life on the jailoo","Stars over the lake"],"note":"Horse riding is optional and depends on preparation.","stay":"Song-Kul, yurt camp"},{"n":6,"title":"Back over the pass","route":"Song-Kul → Kalmak-Ashuu → Bishkek","img":"kalmak","pos":"55% 50%","caption":"Kalmak-Ashuu pass","text":"We say goodbye to the lake and descend to Bishkek over the Kalmak-Ashuu pass. Photo stops on the way.","moments":["Morning by the lake","Kalmak-Ashuu pass","Return to Bishkek"],"stay":"Bishkek, end of the route"}],"fit_yes":["You are interested in the history and atmosphere of the Silk Road, not just the views","You enjoy silence, open sky and unhurried days","You are ready for simple conditions in yurts and guesthouses"],"fit_no":["You expect hotel service every day","You want packed guided tours of museums","You dislike long roads and altitude"],"difficulty":[{"name":"Drives","level":4,"text":"Long sections on mountain and dirt roads"},{"name":"Physical effort","level":2,"text":"Walks near the caravanserai and on the jailoo"},{"name":"Altitude","level":4,"text":"Chatyr-Kul and Song-Kul above 3,000 m"},{"name":"Comfort","level":2,"text":"Yurts and simple guesthouses"}],"difficulty_note":"The scale is approximate. Altitude is a factor on several days of the route: we will discuss how you feel and your preparation in advance.","organization":[["Transport","Two 4x4 vehicles. Some sections are on dirt roads."],["Group","From 4 to 8 travelers."],["Accommodation","Hotels and guesthouses, yurts in Tash-Rabat and at Song-Kul."],["Permits","Chatyr-Kul is in a border zone: we arrange permits in advance."]],"organization_note":"We agree the exact scope of services and the price separately: leave a request, and we will come back with a program and a quote for your group and dates.","faq":[["What makes Tash-Rabat interesting?","It is a medieval stone caravanserai in a mountain valley. It is easy to imagine how merchants rested on the Great Silk Road."],["Do I need permits?","For the Chatyr-Kul area, yes: it is in a border zone, and permits are arranged in advance."],["How much does the trip cost?","The price depends on the size of the group, the dates and the services you choose, so we do not publish a single figure “for everyone”. Leave a request and we will send a program with a quote."],["What if the weather turns bad?","The program may change due to weather, road conditions and participants’ safety. In the mountains that is normal: we discuss backup options in advance."],["Can I travel with my own group?","Yes. We can put together a group for you: friends, family or colleagues. Leave a request and tell us how many of you there are."]]},{"slug":"krysha-mira","badge":"For the bold","title":"Roof of the World","headline":"Семь дней по Алайской долине к подножию пика Ленина","card_title":"Alay, glaciers and base camp","summary":"From ancient Osh over a pass into the Alay Valley: glaciers of the Trans-Alay range, yurts and nights at the foot of Lenin Peak.","hero":"alai","hero_pos":"50% 50%","card_img":"lenin","season":"July — September","months":[7,8,9],"seasons":["summer"],"facts":[["7 / 6","days and nights"],["4–8","travelers"],["2","4x4 vehicles"],["7134","m, Lenin Peak"]],"lakes":[{"name":"Lenin Peak","alt":"7,134 m","img":"lenin","pos":"50% 50%","text":"The glaciers of the Trans-Alay range and the view people travel to southern Kyrgyzstan for."},{"name":"Alay Valley","alt":"high-altitude valley","img":"alai","pos":"50% 50%","text":"A huge valley between ranges with white peaks on the horizon."},{"name":"Camp lakes","alt":"at the foot","img":"lenin_lakes","pos":"50% 50%","text":"Green slopes and small lakes near the base camp."}],"days":[{"n":1,"title":"Osh: an ancient city by the mountain","route":"Osh","img":"alay_red","pos":"50% 50%","caption":"Red rocks of Alay","text":"We meet you in Osh, one of the oldest cities in Central Asia. In the evening — the bazaar, plov and getting to know the group. Tomorrow the road into the mountains begins.","moments":["Osh","Meeting the group","Dinner"],"stay":"Osh, hotel"},{"n":2,"title":"Over the pass into Alay","route":"Osh → Sary-Tash","img":"alay_nura","pos":"50% 50%","caption":"The road to the Alay Valley","text":"We climb over a high pass, and the Alay Valley opens up before us. A night in Sary-Tash, at a crossroads.","moments":["A high pass","View of the Alay Valley","Sary-Tash"],"stay":"Sary-Tash, guesthouse"},{"n":3,"title":"To the foot of Lenin Peak","route":"Sary-Tash → base camp","img":"lenin","pos":"50% 50%","caption":"Lenin Peak","text":"We drive up the valley to base camp: the glaciers get closer while the road gets quieter. In the evening — a yurt and tea beneath the peaks.","moments":["Alay Valley","The foot of Lenin Peak","Evening in a yurt"],"note":"The area is in a border zone: permits are arranged in advance. Altitude about 3,600 m.","stay":"Base camp, yurt"},{"n":4,"title":"A day by the glaciers","route":"Base camp","img":"lenin_lakes","pos":"50% 50%","caption":"Lakes near the base camp","text":"Walks along the slopes and lakes, a lazy day to adjust to altitude. You can climb higher or stay by the yurt.","moments":["Walks by the lakes","Acclimatization","Stars"],"note":"Effort is optional and depends on how you feel.","stay":"Base camp, yurt"},{"n":5,"title":"Red rocks of Alay","route":"Base camp → Alay pastures","img":"alay_red","pos":"50% 50%","img2":"alay_nura","caption":"Jailoo of the Alay district","text":"We descend to the Alay jailoo: red rocks, green slopes and nomads’ homes. Lunch with a family and an evening among the herds.","moments":["Red rocks","Jailoo","Family dinner"],"stay":"Alay, yurts or a guesthouse"},{"n":6,"title":"The road home through the mountains","route":"Alay → Osh","img":"alai","pos":"50% 50%","caption":"Alay Valley","text":"We return to Osh along the same scenic route: the pass and the last photos. A farewell dinner in the city.","moments":["Pass","Return to Osh","Farewell dinner"],"stay":"Osh, hotel"},{"n":7,"title":"Finish","route":"Osh","img":"alay_nura","pos":"50% 50%","caption":"Alay Valley","text":"Breakfast and a transfer to the airport. We will help you plan your departure.","moments":["Breakfast","Transfer","Departure"],"stay":"End of the route"}],"fit_yes":["You are drawn to big mountains, glaciers and open sky","You are comfortable with altitude up to 3,600 m and long roads","The view and the silence matter more to you than comfort"],"fit_no":["You tolerate altitude poorly","You expect a hotel with service every day","You are not ready for cold nights in the mountains"],"difficulty":[{"name":"Drives","level":4,"text":"Long days on mountain roads and passes"},{"name":"Physical effort","level":3,"text":"Walks at altitude, effort is optional"},{"name":"Altitude","level":5,"text":"Base camp at about 3,600 m"},{"name":"Comfort","level":1,"text":"Yurts and simple guesthouses"}],"difficulty_note":"This is one of our highest-altitude routes. Before booking we will discuss health and acclimatization.","organization":[["Transport","Two 4x4 vehicles. Passes and mountain roads."],["Group","From 4 to 8 travelers."],["Accommodation","A hotel in Osh, guesthouses and yurts in the mountains."],["Permits","Border zone: we arrange permits in advance."]],"organization_note":"We agree the exact scope of services and the price separately: leave a request, and we will come back with a program and a quote for your group and dates.","faq":[["Is this a tour for mountaineers?","No. We do not climb Lenin Peak: we drive to its foot in 4x4 vehicles and walk around the base camp."],["How do I avoid altitude sickness?","The route is built with a gradual gain in altitude and a day to adjust. If you have health questions, discuss them with a doctor before the trip."],["How much does the trip cost?","The price depends on the size of the group, the dates and the services you choose, so we do not publish a single figure “for everyone”. Leave a request and we will send a program with a quote."],["What if the weather turns bad?","The program may change due to weather, road conditions and participants’ safety. In the mountains that is normal: we discuss backup options in advance."],["Can I travel with my own group?","Yes. We can put together a group for you: friends, family or co e nomads","Вам нравятся зелёные ландшафты, леса и озёра, а не только скалы":"You like green landscapes, forests and lakes, not only rocks","Вам нравятся мягкий свет, свежая зелень и тишина":"You like soft light, fresh greenery and silence","Вам нравятся тишина, простор и мягкий осенний свет":"You like silence, open space and soft autumn light","Вам нужна гарантированная погода и неизменная программа: в горах она может меняться":"You need guaranteed weather and an unchanging program: in the mountains it can change","Вам нужна гарантированно ясная погода":"You need guaranteed clear weather","Вам нужна неизменная программа":"You need an unchanging program","Вам нужно тепло и купание в озере":"You want warmth and swimming in the lake","Вам нужно тепло ночью":"You want warmth at night","Вам нужны активные дни":"You want active days","Вам нужны активные дни без дорог":"You want active days without roads","Вам нужны плотные экскурсии с гидом по музеям":"You want packed guided tours of museums","Вам нужны сложные спортивные маршруты":"You want challenging sports routes","Вам по душе тишина, открытое небо и неспешные дни":"You enjoy silence, open sky and unhurried days","Вам подойдёт, если":"It suits you if","Вас манят большие горы, ледники и открытое небо":"You are drawn to big mountains, glaciers and open sky","Верховая езда по желанию и по подготовке.":"Horse riding is optional and depends on preparation.","Верховая прогулка":"Horseback ride","Верхом и пешком":"On horseback and on foot","Верхом к Ала-Кулю":"On horseback to Ala-Kul","Верхом к Кель-Суу":"On horseback to Kel-Suu","Весенние каньоны, летние озёра, осенний Сон-Куль и зимний Каракол: у каждого сезона своя поездка.":"Spring canyons, summer lakes, autumn Song-Kul and winter Karakol: every season has its own trip.","Весенние склоны":"Spring slopes","Весна":"Spring","Весна на Иссык-Куле":"Spring at Issyk-Kul","Весна на Иссык-Куле — 5 дней на внедорожниках по Кыргызстану · VOYZ":"Spring at Issyk-Kul — 5-day 4x4 tour les, horse and hiking sections","Внедорожники, прогулки, верховая езда":"4x4 vehicles, walks, horse riding","Водопад «Девичьи косы»":"“Maiden’s Braids” waterfall","Водопад Барскоон":"Barskoon waterfall","Водопады":"Waterfalls","Водопады Барскоона":"Barskoon waterfalls","Водопады Барскоона — «Слёзы барса» и «Чаша Манаса». Потом каньон Сказка: красные, оранжевые и золотые скалы, похожие на замки и целые города. Остаток дня — свободный, на берегу озера.":"The waterfalls of Barskoon — “Snow Leopard’s Tears” and the “Manas Bowl”. Then Skazka canyon: red, orange and golden rocks that look like castles and whole cities. The rest of the day is free, by the lake.","Водохранилище":"Reservoir","Возвращаемся в Ош тем же красивым маршрутом: перевал и последние кадры. Прощальный ужин в городе.":"We return to Osh along the same scenic route: the pass and the last photos. A farewell dinner in the city.","Возвращаемся через Нарын и поднимаемся к Сон-Кулю по знаменитому серпантину «33 попугая». Вечером — юрточный лагерь, ужин и закат над высокогорными пастбищами.":"We return via Naryn and climb to Song-Kul along the famous “33 Parrots” serpentine. In the evening — a yurt camp, dinner and sunset over the high pastures.","Возвращение":"Return","Возвращение в Бишкек":"Return to Bishkek","Возвращение в Ош":"Return to Osh","Вопросы":"Questions","Восемь дней на внедорожниках: три высокогорных озера, красные каньоны и юрты под звёздами.":"Eight days by 4x4: three high-altitude lakes, red canyons and yurts under the stars.","Восемь дней, три озера, два внедорожника":"Eight days, three lakes, two 4x4 vehicles","Все":"All","Все туры":"All tours","Встречаем в Оше, одном из древнейших городов Центральной Азии. Вечером — базар, плов и знакомство с группой. Завтра начинается дорога в горы.":"We meet you in Osh, one of the oldest cities in Central Asia. In the evening — the bazaar, plov and getting to know the group. Tomorrow the road into the mountains begins.","Встречаем и едем: внедорожники, небольшая группа, горы.":"We meet and set off: 4x4 vehicles, a small group, the mountains.","Вы готовы к длинным переездам и серьёзной физической нагрузке в отдельные дни":"You are ready for long drives and serious physical effort on some days","Вы готовы к переменам из-за погоды и снега":"You are ready for changes due to weather and snow","Вы готовы к простым условиям в юртах и гостевых домах":"You are ready for simple conditions in yurts and guesthouses","Вы готовы к холодным ночам в юртах":"You are ready for cold nights in yurts","Вы ждёте гостиничного сервиса каждый день":"You expect hotel service every day","Вы ждёте отеля с сервисом каждый день":"You expect a hotel with service every day","Вы ждёте пятизвёздочного сервиса и спа: в горных лагерях и юртах условия простые":"You expect five-star service and a spa: conditions in mountain camps and yurts are simple","Вы любите зимние горы и тёплые вечера после холода":"You love winter mountains and warm evenings after the cold","Вы любите неспешные прогулки и тишину":"You like unhurried walks and silence","Вы не готовы к конным и пешим участкам даже в простом формате":"You are not ready for horse and hiking sections, even in a simple format","Вы не готовы к холодным ночам в горах":"You are not ready for cold nights in the mountains","Вы не любите возможные снег и грязь на тропах":"You dislike possible snow and mud on the trails","Вы не любите долгие дороги и высоту":"You dislike long roads and altitude","Вы не любите долгие переезды":"You dislike long drives","Вы не любите холод и снег":"You dislike cold and snow","Вы нормально переносите высоту до 3600 м и длинные дороги":"You are comfortable with altitude up to 3,600 m and long roads","Вы плохо переносите высоту":"You tolerate altitude poorly","Вы согласны на переменчивую погоду в начале сезона":"You accept changeable weather at the start of the season","Вы хотите увидеть Сон-Куль без летней суеты":"You want to see Song-Kul without the summer bustle","Вы хотите увидеть главные места Иссык-Куля без летней толпы":"You want to see the main places of Issyk-Kul without the summer crowds","Вы хотите экстремальных высот и ледников":"You want extreme altitudes and glaciers","Выберите":"Select","Выберите сезон":"Select a season","Выберите сезон.":"Pick a season.","Выезд":"Departure","Выезжаем из Бишкека и едем по перевалам к водохранилищу. Вечером — ужин и ночёвка в Токтогуле.":"We leave Bishkek and drive over the passes to the reservoir. In the evening — dinner and a night in Toktogul.","Выезжаем из Бишкека и поднимаемся в горы: перевалы, долины, первые табуны. Вечером — в Нарыне, где начинается настоящая глубинка.":"We leave Bishkek and climb into the mountains: passes, valleys, the first herds. In the evening — Naryn, where the real backcountry begins.","Выезжаем из Бишкека через Боомское ущелье и едем в сторону Кочкора. По пути — остановки для фото и вечер в гостевом доме.":"We leave Bishkek through the Boom gorge and head towards Kochkor. Photo stops on the way and an evening in a guesthouse.","Выезжаем из Бишкека через Боомское ущелье и едем вдоль Иссык-Куля. Вечером — Каракол, тёплая гостиница и ужин.":"We leave Bishkek through the Boom gorge and drive along Issyk-Kul. In the evening — Karakol, a warm hotel and dinner.","Выезжаем из Бишкека, заезжаем в каньоны Кок-Мойнок и едем вдоль северного берега озера. Весной на склонах свежая зелень.":"We leave Bishkek, stop at the Kok-Moynok canyons and drive along the north shore of the lake. In spring the slopes are fresh and green.","Вылет":"Departure","Высокий перевал":"A high pass","Высокогорные долины":"High-altitude valleys","Высокогорные степи":"High-altitude steppes","Высота":"Altitude","Где заканчиваются обычные дороги":"Where the ordinary roads end","Главное":"Highlights","Горные дороги Кыргызстана":"Mountain roads of Kyrgyzstan","Горные дороги, средние по длине дни":"Mountain roads, days of medium length","Горные перевалы":"Mountain passes","Горный лагерь":"Mountain camp","Горный лагерь Кок-Кыя":"Kok-Kiya mountain camp","Горы и снег Каракола":"Mountains and snow of Karakol","Горы над Караколом":"Mountains above Karakol","Горячие источники":"Hot springs","Горячий чай":"Hot tea","Гостевые дома":"Guesthouses","Гостевые дома в селах и заповеднике.":"Guesthouses in the villages and the nature reserve.","Гостевые дома и юрты":"Guesthouses and yurts","Гостевые дома с простыми удобствами":"Guesthouses with simple amenities","Гостиница в Оше, гостевые дома и юрты в горах.":"A hotel in Osh, guesthouses and yurts in the mountains.","Гостиница и юрточные лагеря":"A hotel and yurt camps","Гостиницы в городах, горные лагеря и традиционные юрты.":"Hotels in the cities, mountain camps and traditional yurts.","Гостиницы и гостевые дома":"Hotels and guesthouses","Гостиницы и гостевые дома на берегу.":"Hotels and guesthouses on the shore.","Гостиницы и гостевые дома, юрты в Таш-Рабате и на Сон-Куле.":"Hotels and guesthouses, yurts in Tash-Rabat and at Song-Kul.","Гостиницы, горные лагеря и традиционные юрты":"Hotels, mountain camps and traditional yurts","Гостиницы, горные лагеря, юрты":"Hotels, mountain camps, yurts","Группа":"Group","Да, тёплая зимняя одежда и обувь. Список вещей пришлём заранее.":"Yes, warm winter clothing and footwear. We will send a packing list in advance.","Да. Мы можем собрать группу под вас: друзья, семья или коллеги. Оставьте заявку и напишите в пожеланиях, сколько вас.":"Yes. We can put together a group for you: friends, family or colleagues. Leave a request and tell us how many of you there are.","Да: участок находится в пограничной зоне, и разрешения оформляются заранее. Мы подскажем, какие данные нужны для оформления.":"Yes: the area is in a border zone, and permits are arranged in advance. We will tell you what details are needed.","Давайте поговорим":"Let’s talk","Дальние дни по горным дорогам и перевалам":"Long days on mountain roads and passes","Дальние участки по горным и грунтовым дорогам":"Long sections on mountain and he other places will be added after a shoot.","Для каждого сезона":"For every season","Для кого":"Who it’s for","Для района Чатыр-Куля да: он находится в приграничной зоне, и разрешения оформляются заранее.":"For the Chatyr-Kul area, yes: it is in a border zone, and permits are arranged in advance.","Для смелых":"For the bold","Дни могут быть тёплыми и солнечными, а могут быть прохладными и дождливыми. Мы подбираем программу так, чтобы её можно было гибко менять.":"Days can be warm and sunny, or cool and rainy. We choose the program so that it can be changed flexibly.","Днём может быть тепло, а ночью холодно. Юрты отапливаются, но тёплая одежда нужна.":"It can be warm by day and cold at night. Yurts are heated, but warm clothing is needed.","До ≈ 3500 м: Ала-Куль, Сон-Куль":"Up to ≈ 3,500 m: Ala-Kul, Song-Kul","Долина Алтын-Арашан":"Altyn-Arashan valley","Долина вечером":"The valley in the evening","Дорога в Алайскую долину":"The road to the Alay Valley","Дорога вдоль водохранилища":"The road along the reservoir","Дорога вдоль реки Ат-Баши приводит к Таш-Рабату, средневековому караван-сараю среди холмов. Вечером можно пройтись по долине и услышать тишину, в которой когда-то отдыхали караваны.":"The road along the At-Bashy river leads to Tash-Rabat, a medieval caravanserai among the hills. In the evening you can walk through the valley and hear the silence in which caravans once rested.","Дорога домой":"The road home","Дорога домой через горы":"The road home through the mountains","Дорога к облакам":"The road to the clouds","Дорога к озеру кочевников":"The road to the lake of the nomads","Дорога на Иссык-Куль":"The road to Issyk-Kul","Дорога на восток":"The road east","Дорога на север и затем наверх, к Сон-Кулю. Вечером — юрты, ужин, степной ветер и закат над озером.":"The road north and then up to Song-Kul. In the evening — yurts, dinner, the steppe wind and sunset over the lake.","Дорога на юг":"The road south","Дорога,":"The road,","Дороги за горизонт, озёра между скал, ночи под звёздным небом. Каждая поездка открывает другой Кыргызстан.":"Roads to the horizon, lakes between the rocks, nights under the stars. Every trip opens a different Kyrgyzstan.","Другие маршруты":"More routes","Едем в Бишкек через Орто-Токой и Кочкор. Последние остановки для фото.":"We drive to Bishkek via Orto-Tokoy and Kochkor. Last photo stops.","Едем к Чатыр-Кулю: огромная водная гладь среди открытых хребтов. Здесь много неба и мало людей. Возвращаемся в Ат-Баши на ужин в гостевом доме.":"We drive to Chatyr-Kul: a huge expanse of water among open ranges. Lots of sky here and few people. We return to At-Bashy for dinner in a guesthouse.","Едем на восток. Первое большое впечатление — красные и песочные «замки» каньонов Кок-Мойнок. Дальше — северный берег Иссык-Куля, хребты до горизонта и остановки там, где хочется снимать.":"We head east. The first big impression is the red and sandy “castles” of the Kok-Moynok canyons. Then the north shore of Issyk-Kul, ranges to the horizon and stops wherever you want to take photos.","Едем на южный берег. В Боконбаево знакомимся с традицией охоты с беркутом и слушаем рассказы беркутчи. По дороге — каньон Сказка.":"We drive to the south shore. In Bokonbaevo we learn about the tradition of hunting with an eagle and listen to the eagle hunters’ stories. On the way — Skazka canyon.","Едем по долине к базовому лагерю: ледники становятся всё ближе, а дорога всё тише. Вечером — юрта и чай под вершинами.":"We drive up the valley to base camp: the glaciers get closer while the road gets quieter. In the evening — a yurt and tea beneath the peaks.","Если не нашли ответ, напишите нам: расскажем честно, подходит ли вам такой формат.":"If you did not find an answer, write to us: we will honestly tell you whether this format suits you.","Если позволит время — дополнительная остановка в Григорьевском или Семёновском ущелье.":"If time allows — an extra stop in the Grigoryevka or Semyonovka gorge.","Ещё":"More","Жайлоо":"Jailoo","Жайлоо Алайского района":"Jailoo of the Alay district","Жайлоо Сон-Куля":"Jailoo of Song-Kul","Жизнь на жайлоо":"Life on the jailoo","Завершение":"Finish","Завершение маршрута":"End of the route","Завтрак":"Breakfast","Завтрак и трансфер в аэропорт. Мы подскажем, как лучше спланировать вылет.":"Breakfast and a transfer to the airport. We will help you plan your departure.","Завтрак у озера":"Breakfast by the lake","Задать вопрос":"Ask a question","Закат":"Sunset","Закат над Сон-Кулем":"Sunset over Song-Kul","Закат у воды":"Sunset by the water","Заключительные вечера в юртах у воды и табуны лошадей на закате.":"Final evenings in yurts by the water and herds of horses at sunset.","Заключительный ужин":"Farewell dinner","Закрыть":"Close","Замёрзший водопад ущелья: зимой оно совсем другое.":"A frozen waterfall in the gorge: in winter it is completely different.","Заповедник":"Nature reserve","Заповедник Сары-Челек":"Sary-Chelek Nature Reserve","Заповедник: правила посещения уточняются заранее.":"Nature reserve: visiting rules are confirmed in advance.","Заснеженная долина":"A snowy valley","Зачем":"Why","Заявка":"Request","Звёзды":"Stars","Звёзды над озером":"Stars over the lake","Зелёные долины":"Green valleys","Зелёные склоны и маленькие озёра у базового лагеря.":"Green slopes and small lakes near the base camp.","Зелёный юг":"The green south","Зелёный юг Кыргызстана: крупнейшие в мире естественные ореховые леса, водопады Арсланбоба и озеро Сары-Челек в заповеднике.":"The green south of Kyrgyzstan: the largest natural walnut forests in the world, the waterfalls of Arslanbob and Lake Sary-Chelek in the nature reserve.","Зима":"Winter","Зимние дороги, короткие дни":"Winter roads, short days","Зимний":"Winter","Зимний Иссык-Куль":"Winter Issyk-Kul","Зимний Иссык-Куль — 5 дней на внедорожниках по Кыргызстану · VOYZ":"Winter Issyk-Kul — 5-day 4x4 tour in Kyrgyzstan · VOYZ","Зимой в долину Алтын-Арашан поднимаются на специальном транспорте. Горячие источники, тишина и снег вокруг.":"In winter we go up to the Altyn-Arashan valley in specialized transport. Hot springs, silence and snow all around.","Зимой погода сильнее влияет на программу: мы заранее обсудим запасные варианты.":"In winter the weather affects the program more: we will discuss backup options in advance.","Знакомство с группой":"Meeting the group","Знаменитый серпантин с видами на горные склоны.":"A famous serpentine road with views of the mountain slopes.","Золотой свет на высокогорных пастбищах":"Golden light on the high pastures","Из города — в сердце Тянь-Шаня":"From the city to the heart of the Tian Shan","Имя":"Name","Имя, контакт для связи (Telegram, WhatsApp, телефон или почта), желаемый сезон поездки, число путешественников и комментарий — только то, что вы сами указали в форме заявки.":"Name, contact details (Telegram, WhatsApp, phone or email), preferred travel season, number of travelers and a comment — only what you yourself provide in the request form.","Иссык-Куль":"Issyk-Kul","Иссык-Куль зимой":"Issyk-Kul in winter","Иссык-Куль → Бишкек":"Issyk-Kul → Bishkek","Июл":"Jul","Июль — сентябрь":"July — September","Июн":"Jun","Июнь — сентябрь":"June — September","К каменным стенам караванов":"To the stone walls of the caravans","К кочевникам":"To the nomads","К красным скалам Джети-Огуза":"To the red rocks of Jeti-Oguz","К озеру в заповеднике":"To the lake in the nature reserve","К озеру кочевников":"To the lake of the nomads","К подножию пика Ленина":"To the foot of Lenin Peak","Как вас зовут":"What is your name","Как избежать высотной болезни?":"How do I avoid altitude sickness?","Как мы":"How we","Как мы обрабатываем данные из формы заявки.":"How we process the data from the request form.","Как организован финал, если рейс ночной?":"How does the finale work if the flight is at night?","Как отозвать согласие":"How to withdraw consent","Как с вами связаться":"How can we reach you","Как это работает":"How it works","Какая погода весной?":"What is the weather like i  world and mountain waterfalls.","Крыша":"Roof of the","Крыша мира":"Roof of the World","Крыша мира — 7 дней на внедорожниках по Кыргызстану · VOYZ":"Roof of the World — 7-day 4x4 tour in Kyrgyzstan · VOYZ","Кызыл Аскалар (Кожо-Келен жайлоосу)":"Kyzyl Askalar (Kojo-Kelen jailoo)","Кыргызстан · Тянь-Шань":"Kyrgyzstan · Tian Shan","Ледники Заалайского хребта и вид, ради которого едут на юг Кыргызстана.":"The glaciers of the Trans-Alay range and the view people travel to southern Kyrgyzstan for.","Лес и водопады":"Forest and waterfalls","Леса, водопады и самое чистое озеро":"Forests, waterfalls and the cleanest lake","Лесные тропы":"Forest trails","Лето":"Summer","Лошади":"Horses","Лучше выбрать другое, если":"Better to choose something else if","Лёгкие прогулки":"Easy walks","Лёгкие прогулки и отдых":"Easy walks and rest","Май":"May","Май — июнь и сентябрь — октябрь":"May — June and September — October","Май — июнь, сентябрь — октябрь":"May — June, September — October","Маленькая группа":"Small group","Мар":"Mar","Маршрут":"Route","Маршрут построен с постепенным набором высоты и днём для привыкания. Если у вас есть вопросы по здоровью, обсудите их с врачом перед поездкой.":"The route is built with a gradual gain in altitude and a day to adjust. If you have health questions, discuss them with a doctor before the trip.","Маршрут флагмана":"Flagship route","Маршруты на весь год":"Routes all year round","Меню":"Menu","Местная кухня":"Local cuisine","Можно ли купаться?":"Can I swim?","Можно ли поехать своей компанией?":"Can I travel with my own group?","Мы выбираем маршруты по состоянию дорог и погоды и меняем программу, если условия не позволяют. Безопасность участников важнее плана.":"We choose routes based on road and weather conditions and change the program if conditions do not allow it. The safety of participants comes before the plan.","Мы не привязываем день к минутам: в горах ритм задают погода и дорога. Зато точно знаем, где вы окажетесь и что увидите.":"We do not tie a day to the minute: in the mountains the rhythm is set by weather and road. But we know exactly where you will be and what you will see.","Мы не продаём и не передаём ваши данные третьим лицам, кроме случаев, когда это нужно для организации поездки (например, для оформления разрешений в пограничную зону) и только с вашего согласия.":"We do not sell or pass your data to third parties, except where it is needed to organize the trip (for example, to arrange permits for the border zone) and only with your consent.","Мы проводим этот тур в мае–июне и в сентябре–октябре. Весной всё зелёное и цветёт, осенью можно застать урожай орехов. Сроки уточняем под год.":"We run this tour in May–June and in September–October. In spring everything is green and in bloom; in autumn you can catch the walnut harvest. Dates are confirmed for each year.","Мы свяжемся с вами, ответим на вопросы и пришлём программу с расчётом. Состав услуг и стоимость согласовываем отдельно.":"We will contact you, answer your questions and send a program with a quote. The scope of services and the price are agreed separately.","На специальном внедорожнике поднимаемся в долину Алтын-Арашан, завтракаем среди гор — и в седло. Путь к Ала-Кулю идёт через альпийские луга и каменистые склоны.":"In a specialized 4x4 we climb to the Altyn-Arashan valley, have breakfast in the mountains — and then into the saddle. The way to Ala-Kul leads through alpine meadows and stony slopes.","На юг по горным дорогам":"South along mountain roads","На юг, в глубь Тянь-Шаня":"South, deep into the Tian Shan","Нагрузка по желанию, зависит от самочувствия.":"Effort is optional and depends on how you feel.","Написать":"Write","Написать на почту":"Write by email","Напишите нам любым удобным способом — мы удалим ваши данные.":"Write to us in any convenient way — we will delete your data.","Нарын":"Naryn","Нарын → Ат-Баши → Таш-Рабат":"Naryn → At-Bashy → Tash-Rabat","Нарын → Кель-Суу":"Naryn → Kel-Suu","Нарын → Орто-Токой → Бишкек":" ты.":"The program may change due to weather, road conditions and participants’ safety. In the mountains that is normal: we discuss backup options in advance.","Прогулки лёгкие, по желанию.":"Easy walks, optional.","Прогулки на высоте, нагрузка по желанию":"Walks at altitude, effort is optional","Прогулки по склонам и вдоль озёр, ленивый день для привыкания к высоте. Можно подняться выше или остаться у юрты.":"Walks along the slopes and lakes, a lazy day to adjust to altitude. You can climb higher or stay by the yurt.","Прогулки у караван-сарая и на жайлоо":"Walks near the caravanserai and on the jailoo","Прогулки у озёр":"Walks by the lakes","Продолжаем путь на юг и приезжаем в Арсланбоб: село среди гор и крупнейшего естественного орехового леса на планете.":"We continue south and arrive in Arslanbob: a village among the mountains and the largest natural walnut forest on the planet.","Прощаемся с озером и едем в Джалал-Абад. Оттуда возвращаемся в Бишкек.":"We say goodbye to the lake and drive to Jalal-Abad. From there we return to Bishkek.","Прощаемся с озером и спускаемся к Бишкеку через перевал Калмак-Ашуу. По дороге — остановки для фото.":"We say goodbye to the lake and descend to Bishkek over the Kalmak-Ashuu pass. Photo stops on the way.","Прощальный ужин":"Farewell dinner","Прощание с озером":"Saying goodbye to the lake","Путь":"Caravan","Путь караванов":"Caravan Road","Путь караванов — 6 дней на внедорожниках по Кыргызстану · VOYZ":"Caravan Road — 6-day 4x4 tour in Kyrgyzstan · VOYZ","Пять дней среди золотых жайлоо, юрт и перевалов в мягком осеннем свете.":"Five days among golden jailoos, yurts and passes in soft autumn light.","Пять дней среди красных каньонов, цветущих склонов и тихих берегов в начале сезона.":"Five days among red canyons, blooming slopes and quiet shores at the start of the season.","Пять дней среди снежных гор: горячие источники, ущелья и беркутчи.":"Five days among snowy mountains: hot springs, gorges and eagle hunters.","Ради таких мест
